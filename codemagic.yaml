workflows:
  android-debug:
    name: Shreejee Surveyor Android
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Create Android project files
        script: |
          flutter create --platforms=android .

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build APK
        script: |
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
